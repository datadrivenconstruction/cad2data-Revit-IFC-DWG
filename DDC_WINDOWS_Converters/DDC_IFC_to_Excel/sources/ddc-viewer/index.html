<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: file:; connect-src 'self' data: blob: file:; img-src 'self' data: blob:">
<title>DDC Viewer</title>
<link rel="stylesheet" href="app/style.css">
<script>window.addEventListener("unhandledrejection",function(e){var b=document.body;if(b){b.dataset.errors=(b.dataset.errors||"")+"|rejection:"+((e.reason&&(e.reason.stack||e.reason.message))||e.reason);}});window.addEventListener("error",function(e){var b=document.body;if(b){b.dataset.errors=(b.dataset.errors||"")+"|"+(e.message||"error")+"@"+(e.filename||"").split("/").pop()+":"+e.lineno;}});</script>
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m16 3 12 7v12l-12 7-12-7V10Z M4 10l12 7 12-7 M16 17v12"/></svg>
      <span class="brand-name">DDC <b>Viewer</b></span>
      <span class="offline" data-i18n="offline"></span>
    </div>
    <div class="doc-title" id="docTitle"></div>
    <button class="badge" id="coverageBadge" hidden></button>
    <div class="top-actions">
      <button class="icon-btn" id="btnOpen" data-i18n-title="open"><svg data-icon="open"></svg></button>
      <button class="icon-btn" id="btnShot" data-i18n-title="screenshot"><svg data-icon="shot"></svg></button>
      <button class="icon-btn" id="btnTheme" data-i18n-title="theme"><svg data-icon="theme"></svg></button>
      <button class="pill" id="btnLang">RU</button>
      <button class="icon-btn" id="btnHelp" data-i18n-title="help"><svg data-icon="help"></svg></button>
      <input type="file" id="fileInput" accept=".js,.json" multiple hidden>
    </div>
  </header>

  <aside class="panel left" id="leftPanel">
    <div class="panel-head">
      <div class="tabs" id="treeTabs"></div>
      <button class="icon-btn small collapse" data-collapse="leftPanel" aria-label="collapse"><svg data-icon="left"></svg></button>
    </div>
    <div class="search"><svg data-icon="search"></svg><input id="search" type="search" data-i18n-placeholder="search"></div>
    <div class="filters" id="filters"></div>
    <div class="tree" id="tree"></div>
  </aside>

  <main class="stage" id="stage">
    <div class="viewport" id="viewport"></div>
    <canvas class="overlay" id="overlay"></canvas>
    <div class="viewcube" id="viewcube"></div>
    <div class="sheet-tabs" id="sheetTabs" hidden></div>
    <div class="toolbar" id="toolbar"></div>
    <div class="tool-panel" id="toolPanel" hidden></div>
    <div class="legend" id="legend" hidden></div>
    <div class="hint" id="hint" hidden></div>
    <div class="empty-stage" id="emptyStage" hidden></div>
    <div class="welcome" id="welcome">
      <div class="welcome-card">
                <h1>DDC Viewer</h1>
        <p data-i18n="open_hint"></p>
        <button class="primary" id="btnOpen2"><svg data-icon="open"></svg><span data-i18n="open"></span></button>
        <h2 data-i18n="samples"></h2>
        <div class="sample-list" id="sampleList"></div>
      </div>
    </div>
    <div class="progress" id="progress" hidden><div class="progress-card" role="status" aria-live="polite"><span id="progressText"></span><div class="bar"><i id="progressBar"></i></div></div></div>
    <div class="status" id="status"></div>
  </main>

  <aside class="panel right" id="rightPanel">
    <div class="panel-head">
      <h3 data-i18n="properties"></h3>
      <button class="icon-btn small" id="btnCopyAll" data-i18n-title="copy_all"><svg data-icon="copy"></svg></button>
      <button class="icon-btn small collapse" data-collapse="rightPanel" aria-label="collapse"><svg data-icon="right"></svg></button>
    </div>
    <div class="props" id="props"></div>
  </aside>
</div>
<div class="modal" id="modal" hidden><div class="modal-card"><button class="icon-btn small modal-close" id="modalClose" aria-label="close"><svg data-icon="close"></svg></button><div id="modalBody"></div></div></div>
<div class="toast" id="toast" hidden></div>

<script src="vendor/three.classic.js"></script>
<script src="app/i18n.js"></script>
<script src="app/icons.js"></script>
<script src="app/lib/util.js"></script>
<script src="app/package.js"></script>
<script src="app/engine.js"></script>
<script src="app/viewcube.js"></script>
<script src="app/ui.js"></script>
<script src="samples/index.js" onerror="void 0"></script>
</body>
</html>
