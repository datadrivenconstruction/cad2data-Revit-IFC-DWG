name: ddc-tools publish

# Release flow: push a tag  ddc-tools-vX.Y.Z  (must match version in ddc-tools/pyproject.toml).
# 1) build + tests, 2) upload to TestPyPI, 3) upload to PyPI after manual approval of the
# "pypi" environment. Uses PyPI Trusted Publishing (OIDC): no API tokens are stored anywhere.
# Setup steps for the owner: ddc-tools/PUBLISHING.md

on:
  push:
    tags:
      - "ddc-tools-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish (manual run builds from the selected ref)"
        type: choice
        options: [testpypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ddc-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/ddc-tools-v')
        run: |
          tag="${GITHUB_REF_NAME#ddc-tools-v}"
          ver="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$tag package=$ver"
          test "$tag" = "$ver"
      - name: Install build tools
        run: python -m pip install --upgrade build twine pytest openpyxl pyyaml lxml
      - name: Tests
        run: python -m pytest -q
      - name: Build sdist and wheel
        run: python -m build
      - name: twine check
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ddc-tools-dist
          path: ddc-tools/dist/
          if-no-files-found: error

  smoke:
    # Install the built wheel in a clean environment on each OS and run the entry point.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ddc-tools-dist
          path: dist
      - name: Install wheel and run
        shell: bash
        run: |
          python -m pip install dist/*.whl
          ddc --version
          ddc --help

  publish-testpypi:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ddc-tools/
    permissions:
      id-token: write   # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ddc-tools-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    # Runs only for tag pushes, and only after a reviewer approves the "pypi" environment.
    if: startsWith(github.ref, 'refs/tags/ddc-tools-v')
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ddc-tools/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ddc-tools-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
